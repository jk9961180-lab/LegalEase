<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LegalEase - Legal Document Generator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 50px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #172554;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #172554;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1e3a8a;
        }

        #result {
            white-space: pre-wrap;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 20px;
            border-radius: 8px;
            line-height: 1.6;
            min-height: 100px;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>⚖ LegalEase</h1>
    <p>AI-Powered Legal Document Generator</p>
</header>

<div class="container">

    <div class="card">

        <h2>Create Your Legal Document</h2>

        <form id="documentForm">

            <label for="document_type">Document Type</label>

            <select id="document_type" required>
                <option value="">Select document type</option>
                <option value="Rental Agreement">Rental Agreement</option>
                <option value="Affidavit">Affidavit</option>
                <option value="Leave and License Agreement">
                    Leave and License Agreement
                </option>
                <option value="Declaration">Declaration</option>
            </select>

            <label for="name">Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <label for="address">Address</label>

            <input
                type="text"
                id="address"
                placeholder="Enter your address"
                required
            >

            <label for="details">Details</label>

            <textarea
                id="details"
                placeholder="Enter the required details"
                required
            ></textarea>

            <button type="submit">
                Generate Document
            </button>

        </form>

    </div>

    <div class="card">

        <h2>Generated Document</h2>

        <div id="result">
            Your generated document will appear here.
        </div>

    </div>

</div>

<div class="footer">
    LegalEase © 2026 | For informational purposes only
</div>

<script>

document.getElementById("documentForm").addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const data = {

            document_type:
                document.getElementById("document_type").value,

            name:
                document.getElementById("name").value,

            address:
                document.getElementById("address").value,

            details:
                document.getElementById("details").value
        };

        const resultBox =
            document.getElementById("result");

        resultBox.textContent = "Generating document...";

        try {

            const response = await fetch(
                "http://127.0.0.1:8000/api/generate-document",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)
                }
            );

            const result = await response.json();

            if (!response.ok) {

                resultBox.textContent =
                    JSON.stringify(result, null, 2);

                return;
            }

            resultBox.textContent =
                result.document;

        } catch (error) {

            resultBox.textContent =
                "Error connecting to LegalEase backend: "
                + error.message;
        }
    }
);

</script>

</body>
</html>
